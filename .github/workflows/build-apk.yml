name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Ekstrak proyek ZIP
        run: |
          mkdir project
          unzip -q ShopeeFlashSaleAutoClicker_v3_GitHubActions.zip -d project

      - name: Cari folder Gradle
        run: |
          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Gradle project ditemukan di: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Cari APK
        run: |
          find project -type f -name "app-debug.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeFlashSaleAutoClicker-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
