name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Ekstrak proyek ZIP
        run: |
          mkdir project
          unzip -q ShopeeFlashSaleAutoClicker_v3_GitHubActions.zip -d project

      - name: Build APK
        working-directory: project
        run: |
          gradle --no-daemon assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeFlashSaleAutoClicker-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
